name: DeepCast
options:
  bundleIdPrefix: local.deepcast
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    # Stable local identity (see docs/adr/007): keychain "Always allow" survives rebuilds.
    # Falls back to ad-hoc ("-") if the certificate is missing: DEEPCAST_SIGN_IDENTITY=- xcodebuild …
    CODE_SIGN_IDENTITY: "$(DEEPCAST_SIGN_IDENTITY)"
    DEEPCAST_SIGN_IDENTITY: "DeepCast Local Signing"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  DeepCast:
    type: application
    platform: macOS
    sources:
      - path: DeepCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.deepcast.DeepCast
        PRODUCT_NAME: DeepCast
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DeepCast
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: "Nur für den persönlichen Gebrauch"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  DeepCastTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DeepCastTests
    dependencies:
      - target: DeepCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.deepcast.DeepCastTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DeepCast.app/Contents/MacOS/DeepCast"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DeepCast:
    build:
      targets:
        DeepCast: all
        DeepCastTests: [test]
    test:
      targets:
        - DeepCastTests
